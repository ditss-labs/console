<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Console Bot - Live Monitor | ASUMA</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;600;700&family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --primary: #00ff9d;
            --secondary: #00b8ff;
            --accent: #ff00e5;
            --bg-dark: #0a0f1e;
            --bg-card: #151e2f;
            --text-mono: #e2e8f0;
        }
        
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            background: radial-gradient(circle at 20% 20%, #1a2639, #0a0f1e);
            color: #e2e8f0;
            font-family: 'Inter', sans-serif;
            min-height: 100vh;
            overflow-x: hidden;
        }
        
        /* Terminal-style scrollbar */
        ::-webkit-scrollbar {
            width: 8px;
            height: 8px;
        }
        
        ::-webkit-scrollbar-track {
            background: rgba(0, 255, 157, 0.05);
            border-radius: 4px;
        }
        
        ::-webkit-scrollbar-thumb {
            background: linear-gradient(135deg, var(--primary), var(--secondary));
            border-radius: 4px;
        }
        
        /* Glassmorphism with neon effect */
        .glass-terminal {
            background: rgba(10, 15, 30, 0.7);
            backdrop-filter: blur(12px);
            border: 1px solid rgba(0, 255, 157, 0.15);
            box-shadow: 
                0 8px 32px rgba(0, 0, 0, 0.4),
                0 0 0 1px rgba(0, 255, 157, 0.05),
                inset 0 0 30px rgba(0, 255, 157, 0.05);
        }
        
        .glass-card {
            background: rgba(21, 30, 47, 0.8);
            backdrop-filter: blur(12px);
            border: 1px solid rgba(0, 184, 255, 0.15);
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.3);
            transition: all 0.3s ease;
        }
        
        .glass-card:hover {
            border-color: rgba(0, 255, 157, 0.3);
            box-shadow: 0 8px 32px rgba(0, 255, 157, 0.1);
        }
        
        /* Neon text effects */
        .neon-text {
            background: linear-gradient(135deg, var(--primary), var(--secondary));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            font-weight: 700;
        }
        
        .neon-glow {
            text-shadow: 
                0 0 10px rgba(0, 255, 157, 0.5),
                0 0 20px rgba(0, 184, 255, 0.3);
        }
        
        /* Log entry styling */
        .log-entry {
            border-left: 3px solid transparent;
            transition: all 0.2s ease;
            animation: slideIn 0.3s ease-out;
        }
        
        .log-entry:hover {
            border-left-color: var(--primary);
            background: rgba(0, 255, 157, 0.05);
            transform: translateX(4px);
        }
        
        .log-system {
            border-left-color: #8b5cf6;
        }
        
        .log-system:hover {
            background: rgba(139, 92, 246, 0.05);
        }
        
        .log-command {
            border-left-color: #10b981;
        }
        
        .log-command:hover {
            background: rgba(16, 185, 129, 0.05);
        }
        
        /* Command highlight */
        .command-highlight {
            background: linear-gradient(90deg, rgba(0, 255, 157, 0.1), transparent);
            padding: 4px 8px;
            border-radius: 6px;
            font-family: 'JetBrains Mono', monospace;
            color: var(--primary);
        }
        
        /* Pulse animation for live indicator */
        .live-dot {
            width: 10px;
            height: 10px;
            background: #10b981;
            border-radius: 50%;
            animation: pulse 2s infinite;
            box-shadow: 0 0 15px #10b981;
        }
        
        @keyframes pulse {
            0% {
                opacity: 1;
                transform: scale(1);
            }
            50% {
                opacity: 0.6;
                transform: scale(1.2);
            }
            100% {
                opacity: 1;
                transform: scale(1);
            }
        }
        
        /* Console line styling */
        .console-line {
            font-family: 'JetBrains Mono', monospace;
            color: #a0aec0;
            padding: 2px 0;
            border-bottom: 1px solid rgba(255, 255, 255, 0.02);
        }
        
        .console-line::before {
            content: '>';
            color: var(--primary);
            margin-right: 8px;
            opacity: 0.5;
        }
        
        /* User info badges */
        .badge-operator {
            background: linear-gradient(135deg, #3b82f6, #8b5cf6);
            padding: 2px 8px;
            border-radius: 12px;
            font-size: 10px;
            font-weight: 600;
        }
        
        .badge-device {
            background: rgba(0, 255, 157, 0.1);
            border: 1px solid rgba(0, 255, 157, 0.3);
            padding: 2px 8px;
            border-radius: 12px;
            font-size: 10px;
        }
        
        /* Stat cards */
        .stat-card {
            background: linear-gradient(135deg, #1e293b, #0f172a);
            border-radius: 16px;
            padding: 20px;
            position: relative;
            overflow: hidden;
            border: 1px solid rgba(0, 255, 157, 0.1);
        }
        
        .stat-card::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            height: 2px;
            background: linear-gradient(90deg, var(--primary), var(--secondary));
        }
        
        /* Loading animation */
        .loading-bar {
            width: 100%;
            height: 4px;
            background: linear-gradient(90deg, var(--primary), var(--secondary));
            animation: loading 1.5s infinite;
        }
        
        @keyframes loading {
            0% { transform: translateX(-100%); }
            100% { transform: translateX(100%); }
        }
        
        /* Fade in animations */
        .fade-in {
            animation: fadeIn 0.5s ease-out;
        }
        
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }
        
        /* Mobile responsive */
        @media (max-width: 768px) {
            .log-details {
                flex-direction: column;
                gap: 8px;
            }
            
            .stat-cards {
                grid-template-columns: 1fr 1fr !important;
            }
            
            .console-lines {
                max-height: 200px !important;
            }
        }
        
        /* Terminal typing effect */
        .typing {
            overflow: hidden;
            white-space: nowrap;
            border-right: 2px solid var(--primary);
            animation: typing 3s steps(40, end), blink-caret 0.75s step-end infinite;
        }
        
        @keyframes typing {
            from { width: 0; }
            to { width: 100%; }
        }
        
        @keyframes blink-caret {
            from, to { border-color: transparent; }
            50% { border-color: var(--primary); }
        }
        
        /* Console container */
        .console-container {
            max-height: 500px;
            overflow-y: auto;
            padding: 10px;
            background: rgba(0, 0, 0, 0.3);
            border-radius: 8px;
            font-family: 'JetBrains Mono', monospace;
            font-size: 12px;
        }
        
        /* Mobile bottom sheet */
        .mobile-sheet {
            position: fixed;
            bottom: 0;
            left: 0;
            right: 0;
            background: rgba(10, 15, 30, 0.95);
            backdrop-filter: blur(10px);
            border-top: 1px solid var(--primary);
            transform: translateY(100%);
            transition: transform 0.3s ease;
            z-index: 1000;
            padding: 20px;
        }
        
        .mobile-sheet.show {
            transform: translateY(0);
        }
    </style>
</head>
<body class="p-4 lg:p-8">
    <!-- Background Elements -->
    <div class="fixed inset-0 overflow-hidden pointer-events-none">
        <div class="absolute top-20 left-10 w-64 h-64 bg-gradient-to-r from-cyan-500/5 to-blue-500/5 rounded-full blur-3xl"></div>
        <div class="absolute bottom-20 right-10 w-80 h-80 bg-gradient-to-r from-purple-500/5 to-pink-500/5 rounded-full blur-3xl"></div>
        <div class="absolute top-1/2 left-1/2 transform -translate-x-1/2 -translate-y-1/2 w-96 h-96 bg-gradient-to-r from-emerald-500/5 to-teal-500/5 rounded-full blur-3xl"></div>
    </div>

    <!-- Header -->
    <div class="max-w-7xl mx-auto relative z-10">
        <div class="glass-terminal rounded-3xl p-6 mb-8">
            <div class="flex flex-col lg:flex-row items-start lg:items-center justify-between gap-6">
                <div class="flex items-center gap-6">
                    <div class="relative">
                        <div class="w-16 h-16 bg-gradient-to-br from-emerald-500 to-cyan-500 rounded-2xl flex items-center justify-center">
                            <i class="fas fa-terminal text-3xl text-white"></i>
                        </div>
                        <div class="absolute -top-1 -right-1 w-4 h-4">
                            <span class="absolute inline-flex h-full w-full rounded-full bg-emerald-400 opacity-75 animate-ping"></span>
                            <span class="relative inline-flex rounded-full h-4 w-4 bg-emerald-500"></span>
                        </div>
                    </div>
                    <div>
                        <div class="flex items-center gap-3 mb-2">
                            <h1 class="text-3xl lg:text-4xl font-bold neon-text neon-glow">CONSOLE BOT</h1>
                            <span class="px-3 py-1 bg-emerald-500/20 text-emerald-400 rounded-full text-xs border border-emerald-500/30">
                                LIVE
                            </span>
                        </div>
                        <p class="text-gray-400 flex items-center gap-2 text-sm">
                            <i class="fas fa-database text-emerald-400"></i>
                            Real-time monitoring from <span class="font-mono text-emerald-400">https://console-bot.vercel.app/api/logs</span>
                        </p>
                    </div>
                </div>
                
                <div class="flex flex-wrap gap-4">
                    <div class="flex items-center gap-3 bg-black/30 px-4 py-2 rounded-xl">
                        <div class="live-dot"></div>
                        <span class="text-sm font-mono" id="lastUpdate">Last update: 0s ago</span>
                    </div>
                    <button onclick="refreshData()" class="px-5 py-2 glass-terminal hover:bg-white/5 rounded-xl transition flex items-center gap-2">
                        <i class="fas fa-sync-alt"></i>
                        <span>Refresh</span>
                    </button>
                    <button onclick="toggleAutoRefresh()" class="px-5 py-2 bg-gradient-to-r from-emerald-500 to-cyan-500 text-white rounded-xl hover:shadow-lg hover:shadow-emerald-500/20 transition flex items-center gap-2" id="autoRefreshBtn">
                        <i class="fas fa-play"></i>
                        <span>Auto (30s)</span>
                    </button>
                </div>
            </div>
        </div>

        <!-- Stats Cards -->
        <div class="grid grid-cols-2 lg:grid-cols-5 gap-4 mb-8" id="statsContainer">
            <div class="stat-card">
                <div class="flex items-center justify-between mb-2">
                    <i class="fas fa-terminal text-2xl text-emerald-400"></i>
                    <span class="text-xs bg-emerald-500/20 text-emerald-400 px-2 py-1 rounded-full">Total</span>
                </div>
                <div class="text-3xl font-bold mb-1" id="totalLogs">0</div>
                <div class="text-xs text-gray-400">Total Logs</div>
            </div>
            
            <div class="stat-card">
                <div class="flex items-center justify-between mb-2">
                    <i class="fas fa-robot text-2xl text-blue-400"></i>
                    <span class="text-xs bg-blue-500/20 text-blue-400 px-2 py-1 rounded-full">Today</span>
                </div>
                <div class="text-3xl font-bold mb-1" id="todayLogs">0</div>
                <div class="text-xs text-gray-400">Today's Logs</div>
            </div>
            
            <div class="stat-card">
                <div class="flex items-center justify-between mb-2">
                    <i class="fas fa-code-branch text-2xl text-purple-400"></i>
                    <span class="text-xs bg-purple-500/20 text-purple-400 px-2 py-1 rounded-full">Commands</span>
                </div>
                <div class="text-3xl font-bold mb-1" id="commandCount">0</div>
                <div class="text-xs text-gray-400">Total Commands</div>
            </div>
            
            <div class="stat-card">
                <div class="flex items-center justify-between mb-2">
                    <i class="fas fa-users text-2xl text-amber-400"></i>
                    <span class="text-xs bg-amber-500/20 text-amber-400 px-2 py-1 rounded-full">Users</span>
                </div>
                <div class="text-3xl font-bold mb-1" id="uniqueUsers">0</div>
                <div class="text-xs text-gray-400">Unique Users</div>
            </div>
            
            <div class="stat-card">
                <div class="flex items-center justify-between mb-2">
                    <i class="fas fa-globe text-2xl text-rose-400"></i>
                    <span class="text-xs bg-rose-500/20 text-rose-400 px-2 py-1 rounded-full">Operators</span>
                </div>
                <div class="text-3xl font-bold mb-1" id="operatorCount">0</div>
                <div class="text-xs text-gray-400">Network Operators</div>
            </div>
        </div>

        <!-- Filter Bar -->
        <div class="glass-card rounded-2xl p-4 mb-8">
            <div class="flex flex-wrap items-center justify-between gap-4">
                <div class="flex flex-wrap gap-2">
                    <button onclick="filterLogs('all')" class="filter-btn px-4 py-2 rounded-xl bg-emerald-500 text-white transition" data-filter="all">
                        <i class="fas fa-list mr-2"></i>All Logs
                    </button>
                    <button onclick="filterLogs('command')" class="filter-btn px-4 py-2 rounded-xl bg-gray-800 hover:bg-gray-700 transition" data-filter="command">
                        <i class="fas fa-terminal mr-2"></i>Commands
                    </button>
                    <button onclick="filterLogs('system')" class="filter-btn px-4 py-2 rounded-xl bg-gray-800 hover:bg-gray-700 transition" data-filter="system">
                        <i class="fas fa-server mr-2"></i>System
                    </button>
                </div>
                
                <div class="flex items-center gap-2">
                    <i class="fas fa-search text-gray-400"></i>
                    <input type="text" id="searchInput" placeholder="Search logs..." class="bg-gray-800/50 border border-gray-700 rounded-xl px-4 py-2 text-sm focus:outline-none focus:border-emerald-500">
                </div>
            </div>
        </div>

        <!-- Logs Container -->
        <div class="space-y-4" id="logsContainer">
            <!-- Logs will be injected here by JavaScript -->
            <div class="text-center py-12">
                <div class="inline-block animate-spin rounded-full h-8 w-8 border-t-2 border-b-2 border-emerald-500 mb-4"></div>
                <p class="text-gray-400">Loading logs...</p>
            </div>
        </div>
    </div>

    <!-- Mobile Bottom Sheet for Log Details -->
    <div class="mobile-sheet" id="mobileSheet">
        <div class="flex justify-between items-center mb-4">
            <h3 class="font-bold text-lg">Log Details</h3>
            <button onclick="hideMobileSheet()" class="p-2 hover:bg-white/10 rounded-lg">
                <i class="fas fa-times"></i>
            </button>
        </div>
        <div id="sheetContent" class="space-y-4 max-h-[70vh] overflow-y-auto"></div>
    </div>

    <script>
        // Configuration
        const API_URL = 'https://console-bot.vercel.app/api/logs';
        let logs = [];
        let filteredLogs = [];
        let autoRefresh = true;
        let refreshInterval;
        let currentFilter = 'all';
        let searchTerm = '';

        // Initialize
        document.addEventListener('DOMContentLoaded', () => {
            fetchLogs();
            startAutoRefresh();
        });

        // Fetch logs from API
        async function fetchLogs() {
            try {
                const response = await fetch(API_URL);
                const data = await response.json();
                
                if (data.success) {
                    logs = data.data;
                    filteredLogs = logs;
                    updateUI();
                }
            } catch (error) {
                console.error('Error fetching logs:', error);
                showToast('Failed to fetch logs', 'error');
            }
        }

        // Update UI with logs
        function updateUI() {
            applyFilters();
            updateStats();
            renderLogs();
            updateLastUpdateTime();
        }

        // Apply filters and search
        function applyFilters() {
            filteredLogs = logs.filter(log => {
                // Filter by type
                if (currentFilter !== 'all' && log.type !== currentFilter) {
                    return false;
                }
                
                // Search
                if (searchTerm) {
                    const searchLower = searchTerm.toLowerCase();
                    const logString = JSON.stringify(log).toLowerCase();
                    return logString.includes(searchLower);
                }
                
                return true;
            });
        }

        // Update statistics
        function updateStats() {
            const today = new Date().toDateString();
            
            document.getElementById('totalLogs').textContent = logs.length;
            document.getElementById('todayLogs').textContent = logs.filter(log => 
                new Date(log.createdAt || log.timestamp).toDateString() === today
            ).length;
            document.getElementById('commandCount').textContent = logs.filter(log => log.type === 'command').length;
            
            const uniqueUsers = new Set();
            const operators = new Set();
            
            logs.forEach(log => {
                if (log.type === 'command' && log.userInfo) {
                    uniqueUsers.add(log.userInfo.id);
                    if (log.userInfo.operator) {
                        operators.add(log.userInfo.operator);
                    }
                }
            });
            
            document.getElementById('uniqueUsers').textContent = uniqueUsers.size;
            document.getElementById('operatorCount').textContent = operators.size;
        }

        // Render logs
        function renderLogs() {
            const container = document.getElementById('logsContainer');
            
            if (filteredLogs.length === 0) {
                container.innerHTML = `
                    <div class="glass-card rounded-2xl p-12 text-center">
                        <i class="fas fa-inbox text-5xl text-gray-600 mb-4"></i>
                        <h3 class="text-xl font-bold text-gray-400 mb-2">No logs found</h3>
                        <p class="text-gray-500">Try adjusting your filters</p>
                    </div>
                `;
                return;
            }

            container.innerHTML = filteredLogs.map((log, index) => `
                <div class="glass-card rounded-2xl p-6 log-entry ${log.type === 'system' ? 'log-system' : 'log-command'} fade-in" style="animation-delay: ${index * 0.05}s" onclick="showLogDetails(${index})">
                    <div class="flex flex-col lg:flex-row justify-between gap-4 mb-4">
                        <div class="flex items-center gap-3">
                            <div class="w-10 h-10 rounded-xl ${log.type === 'system' ? 'bg-purple-500/20' : 'bg-emerald-500/20'} flex items-center justify-center">
                                <i class="fas ${log.type === 'system' ? 'fa-server' : 'fa-terminal'} ${log.type === 'system' ? 'text-purple-400' : 'text-emerald-400'}"></i>
                            </div>
                            <div>
                                <div class="flex items-center gap-2 flex-wrap">
                                    <span class="font-mono text-sm ${log.type === 'system' ? 'text-purple-400' : 'text-emerald-400'}">${log._id.substring(0, 8)}...</span>
                                    <span class="px-2 py-0.5 rounded-full text-xs ${log.type === 'system' ? 'bg-purple-500/20 text-purple-300' : 'bg-emerald-500/20 text-emerald-300'} border ${log.type === 'system' ? 'border-purple-500/30' : 'border-emerald-500/30'}">
                                        ${log.type}
                                    </span>
                                    ${log.botName ? `
                                        <span class="px-2 py-0.5 bg-blue-500/20 text-blue-300 rounded-full text-xs border border-blue-500/30">
                                            <i class="fas fa-robot mr-1"></i>${log.botName}
                                        </span>
                                    ` : ''}
                                </div>
                                <div class="text-xs text-gray-400 mt-1">
                                    <i class="far fa-clock mr-1"></i>${new Date(log.createdAt || log.timestamp).toLocaleString()}
                                </div>
                            </div>
                        </div>
                        
                        ${log.type === 'command' && log.userInfo ? `
                            <div class="flex items-center gap-2 flex-wrap">
                                <span class="badge-operator">${log.userInfo.operator || 'Unknown'}</span>
                                <span class="badge-device">${log.userInfo.device || 'unknown'}</span>
                                ${log.messageInfo ? `
                                    <span class="px-2 py-0.5 bg-amber-500/20 text-amber-300 rounded-full text-xs border border-amber-500/30">
                                        <i class="fas fa-hashtag mr-1"></i>${log.messageInfo.command}
                                    </span>
                                ` : ''}
                            </div>
                        ` : ''}
                    </div>

                    <div class="mb-4">
                        ${log.type === 'system' ? `
                            <div class="flex items-center gap-2 text-sm">
                                <i class="fas fa-info-circle text-gray-400"></i>
                                <span class="command-highlight">${log.message}</span>
                            </div>
                        ` : log.type === 'command' && log.consoleLines ? `
                            <div class="flex items-center gap-2 mb-3">
                                <i class="fas fa-terminal text-emerald-400"></i>
                                <span class="command-highlight">${log.messageInfo?.command || 'Unknown'} ${log.messageInfo?.args?.join(' ') || ''}</span>
                            </div>
                            <div class="console-container">
                                ${log.consoleLines.slice(0, 5).map(line => `
                                    <div class="console-line">${line}</div>
                                `).join('')}
                                ${log.consoleLines.length > 5 ? `
                                    <div class="text-xs text-gray-500 mt-2">...and ${log.consoleLines.length - 5} more lines</div>
                                ` : ''}
                            </div>
                        ` : ''}
                    </div>

                    ${log.type === 'command' && log.userInfo ? `
                        <div class="flex flex-wrap gap-4 text-xs text-gray-400 border-t border-gray-800/50 pt-4 mt-2">
                            <div class="flex items-center gap-2">
                                <i class="fas fa-user text-gray-500"></i>
                                <span>${log.userInfo.pushname || 'Unknown'}</span>
                            </div>
                            <div class="flex items-center gap-2">
                                <i class="fas fa-phone text-gray-500"></i>
                                <span class="font-mono">${log.userInfo.nomor?.split('@')[0] || 'Unknown'}</span>
                            </div>
                            ${log.chatInfo?.id?.includes('g.us') ? `
                                <div class="flex items-center gap-2">
                                    <i class="fas fa-users text-gray-500"></i>
                                    <span>Group Chat</span>
                                </div>
                            ` : ''}
                            ${log.duration ? `
                                <div class="flex items-center gap-2">
                                    <i class="fas fa-hourglass-half text-gray-500"></i>
                                    <span>${log.duration}</span>
                                </div>
                            ` : ''}
                        </div>
                    ` : ''}

                    <div class="mt-3 text-right">
                        <span class="text-xs text-gray-500 cursor-pointer hover:text-emerald-400 transition" onclick="event.stopPropagation(); toggleDetails(${index})">
                            <i class="fas fa-chevron-down mr-1"></i>Click for details
                        </span>
                    </div>
                </div>
            `).join('');
        }

        // Show detailed log view
        function showLogDetails(index) {
            const log = filteredLogs[index];
            
            if (window.innerWidth <= 768) {
                // Show mobile sheet
                const sheet = document.getElementById('mobileSheet');
                const content = document.getElementById('sheetContent');
                
                content.innerHTML = `
                    <pre class="bg-black/50 p-4 rounded-xl overflow-x-auto text-xs font-mono">
                        ${JSON.stringify(log, null, 2)}
                    </pre>
                `;
                
                sheet.classList.add('show');
            } else {
                // Desktop modal or expand
                alert(JSON.stringify(log, null, 2));
            }
        }

        function hideMobileSheet() {
            document.getElementById('mobileSheet').classList.remove('show');
        }

        function toggleDetails(index) {
            const log = filteredLogs[index];
            // Could implement expand/collapse here
        }

        // Filter logs
        function filterLogs(type) {
            currentFilter = type;
            
            // Update button styles
            document.querySelectorAll('.filter-btn').forEach(btn => {
                if (btn.dataset.filter === type) {
                    btn.className = 'filter-btn px-4 py-2 rounded-xl bg-emerald-500 text-white transition';
                } else {
                    btn.className = 'filter-btn px-4 py-2 rounded-xl bg-gray-800 hover:bg-gray-700 transition';
                }
            });
            
            applyFilters();
            renderLogs();
        }

        // Search functionality
        document.getElementById('searchInput').addEventListener('input', (e) => {
            searchTerm = e.target.value;
            applyFilters();
            renderLogs();
        });

        // Auto refresh
        function startAutoRefresh() {
            if (refreshInterval) clearInterval(refreshInterval);
            refreshInterval = setInterval(() => {
                if (autoRefresh) {
                    fetchLogs();
                }
            }, 30000);
        }

        function toggleAutoRefresh() {
            autoRefresh = !autoRefresh;
            const btn = document.getElementById('autoRefreshBtn');
            
            if (autoRefresh) {
                btn.innerHTML = '<i class="fas fa-play"></i><span>Auto (30s)</span>';
                btn.className = 'px-5 py-2 bg-gradient-to-r from-emerald-500 to-cyan-500 text-white rounded-xl hover:shadow-lg hover:shadow-emerald-500/20 transition flex items-center gap-2';
                startAutoRefresh();
            } else {
                btn.innerHTML = '<i class="fas fa-pause"></i><span>Paused</span>';
                btn.className = 'px-5 py-2 bg-gray-700 text-white rounded-xl transition flex items-center gap-2';
            }
        }

        function refreshData() {
            fetchLogs();
            showToast('Refreshing data...');
        }

        // Update last update time
        function updateLastUpdateTime() {
            document.getElementById('lastUpdate').textContent = 'Last update: just now';
            
            let seconds = 0;
            setInterval(() => {
                seconds++;
                document.getElementById('lastUpdate').textContent = `Last update: ${seconds}s ago`;
            }, 1000);
        }

        // Toast notification
        function showToast(message, type = 'success') {
            const toast = document.createElement('div');
            toast.className = `fixed bottom-6 right-6 px-6 py-4 rounded-xl shadow-2xl text-white font-medium flex items-center gap-3 z-50 animate-fade-in ${type === 'error' ? 'bg-red-500' : 'bg-emerald-500'}`;
            toast.innerHTML = `
                <i class="fas ${type === 'error' ? 'fa-exclamation-circle' : 'fa-check-circle'}"></i>
                <span>${message}</span>
            `;
            document.body.appendChild(toast);
            
            setTimeout(() => {
                toast.style.animation = 'fadeOut 0.3s ease-out';
                setTimeout(() => toast.remove(), 300);
            }, 3000);
        }

        // Add CSS for animations
        const style = document.createElement('style');
        style.textContent = `
            @keyframes fadeIn {
                from { opacity: 0; transform: translateY(20px); }
                to { opacity: 1; transform: translateY(0); }
            }
            @keyframes fadeOut {
                from { opacity: 1; transform: translateY(0); }
                to { opacity: 0; transform: translateY(20px); }
            }
            .animate-fade-in {
                animation: fadeIn 0.3s ease-out;
            }
        `;
        document.head.appendChild(style);
    </script>
</body>
</html>
